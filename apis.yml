aid: cur8
name: Cur8
description: 'CUR8 is a carbon removal intelligence platform based in Oxford, United Kingdom,
  building the global market for high-quality carbon removals with a mission to remove one
  billion tonnes of carbon a year. Founded in 2021 by Mark Stevenson, Marta Krupinska and
  Gabrielle Walker, CUR8 combines financial and scientific expertise to source, evaluate
  and manage diversified carbon removal portfolios spanning nature restoration, biochar,
  direct air capture, enhanced weathering, superpollutant abatement and sustainable aviation
  fuel. Its platform surfaces (Discover for sourcing removal assets, Manage for tracking
  portfolio performance and risk, Finance for capital provision, and the Carbon Planner for
  strategy) help enterprises invest in carbon impact with confidence on the path to net zero.
  Clients include Microsoft, Coca-Cola HBC, Standard Chartered, Arup and UBS. CUR8 is backed
  by Google Ventures (GV) and Airbus Ventures. No public API, SDK or developer program is
  advertised as of this profile; access is via the CUR8 dashboard and platform.'
